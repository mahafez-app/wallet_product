name: wallet_product
description: Layer 3 Autonomous Wallet & Transaction Domain Vertical Product Package.
version: 2.0.0
repository: https://github.com/mahafez-app/wallet_product
publish_to: 'none'

environment:
  sdk: ^3.13.3
  flutter: ">=3.47.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Layer 1 Platform Packages ---
  mahafez_core:
    git:
      url: https://github.com/mahafez-app/mahafez_core.git
      ref: v1.0.1
  mahafez_design_system:
    git:
      url: https://github.com/mahafez-app/mahafez_design_system.git
      ref: v1.0.2

  # --- Layer 2 Capabilities ---
  sms_engine:
    git:
      url: https://github.com/mahafez-app/sms_engine.git
      ref: v1.0.1

  # State Management & Cloud Services
  flutter_riverpod: ^3.3.1
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0
  rxdart: ^0.28.0
  equatable: ^2.0.8
  intl: ^0.20.2
  flutter_svg: ^2.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  share_plus: ^12.0.2
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  assets:
    - assets/icons/
